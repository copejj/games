    <!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{fragments/common :: common-head(title='Spades')}"></head>
<body class="bg-gray-100 min-h-screen flex flex-col" x-data="spadesApp" @open-settings.window="showSettings = true">
    <div th:replace="~{fragments/layout :: header(~{:: #settings-btn})}">
        <button id="settings-btn" @click="$dispatch('open-settings')" class="p-1 hover:bg-blue-700 rounded-lg transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </div>
    <main class="p-4 max-w-md landscape:max-w-4xl mx-auto flex-grow w-full relative">
        <!-- Settings Modal -->
        <div x-show="showSettings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" x-cloak>
            <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl" @click.away="showSettings = false">
                <h3 class="text-xl font-bold mb-4 text-gray-800">Game Settings</h3>
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-600 mb-1">Score Limit</label>
                    <input type="number" x-model.number="maxScore" class="w-full border-2 rounded-xl p-3 outline-none text-gray-800">
                </div>
                <div class="border-t pt-4 space-y-3 mb-6">
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" x-model="settings.minBidFour" class="w-5 h-5 rounded text-blue-600"><span class="text-sm font-semibold">Minimum Bid of 4</span></label>
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" x-model="settings.bagsPenalty" class="w-5 h-5 rounded text-blue-600"><span class="text-sm font-semibold">Track Bags (10 Bags = -100)</span></label>
                    <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" x-model="settings.nilAllowed" class="w-5 h-5 rounded text-blue-600"><span class="text-sm font-semibold">Allow NIL Bidding</span></label>
                </div>
                <button @click="showSettings = false" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">Save & Close</button>
            </div>
        </div>
        <!-- Winner Modal -->
        <div x-show="winner" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" x-cloak>
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center border-4 border-green-500 shadow-2xl">
                <h2 class="text-3xl font-black text-gray-800 mb-2">Winner!</h2>
                <div class="text-4xl font-mono font-black text-blue-600 mb-2" x-text="winner?.name"></div>
                <p class="text-gray-500 mb-6 italic">Finished with <span class="font-bold text-gray-800" x-text="winner ? calculateTotalScore(winner) : 0"></span> points</p>
                <button @click="winner = null" class="w-full bg-gray-800 text-white font-bold py-4 rounded-xl hover:bg-black transition">Close & Review</button>
            </div>
        </div>
        <!-- Admin Buttons -->
        <div class="flex flex-wrap gap-2 mb-4 w-full">
            <button @click="resetGame" class="flex-1 bg-red-600 text-white font-bold py-3 px-2 rounded-xl text-xs sm:text-sm whitespace-nowrap">Reset All</button>
            <button @click="resetScores" class="flex-1 bg-amber-500 text-white font-bold py-3 px-2 rounded-xl text-xs sm:text-sm whitespace-nowrap">Reset Scores</button>
            <button @click="resetLastRound" class="flex-1 bg-gray-600 text-white font-bold py-3 px-2 rounded-xl text-xs sm:text-sm whitespace-nowrap">Reset Last</button>
        </div>
        <!-- Scoreboard Cards Container -->
        <div class="flex flex-wrap gap-4 justify-center">
            <template x-for="(team, index) in teams" :key="index">
                <div :class="index === dealerIndex ? 'ring-4 ring-blue-400 border-blue-500' : 'border-gray-100'" class="relative bg-white rounded-2xl shadow-sm border p-5 w-full sm:w-[calc(50%-1rem)] min-w-[280px]">
                    <span x-show="index === dealerIndex" class="absolute -top-3 left-4 text-[11px] bg-blue-600 text-white px-3 py-1 rounded-xl font-bold uppercase tracking-wider shadow-md">Dealer</span>
                    <div class="flex justify-between items-center mb-4 pt-1 w-full">
                        <input type="text" x-model="team.name" placeholder="Team Name" class="text-xl font-extrabold outline-none bg-transparent w-full text-gray-800">
                        <div class="text-right">
                            <div class="text-3xl font-mono font-black text-blue-600" x-text="calculateTotalScore(team)"></div>
                            <div x-show="settings.bagsPenalty" class="text-[11px] font-bold text-amber-600 whitespace-nowrap">Bags: <span x-text="calculateCurrentBags(team)">0</span>/10</div>
                        </div>
                    </div>
                    <!-- Form Score Keep Matrix Section -->
                    <div class="space-y-3 mt-2">
                        <template x-if="settings.nilAllowed">
                            <div class="space-y-3">
                                <div class="grid grid-cols-12 gap-2 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider"><div class="col-span-6 text-left">Player</div><div class="col-span-3">Bid</div><div class="col-span-3">Books</div></div>
                                <!-- Player 1 Row Layout Elements -->
                                <div class="grid grid-cols-12 gap-2 items-center">
                                    <div class="col-span-6"><input tabindex="-1" type="text" x-model="team.p1_name" class="w-full bg-gray-50 rounded-xl px-2 py-1.5 text-sm font-semibold outline-none text-gray-700"></div>
                                    <div class="col-span-3"><input tabindex="1" type="number" min="0" max="13" x-model.number="team.p1_bid" placeholder="Bid" class="w-full bg-gray-50 rounded-xl py-1.5 text-center text-sm font-mono font-bold text-gray-800"></div>
                                    <div class="col-span-3"><input tabindex="3" type="number" min="0" max="13" x-model.number="team.p1_tricks" placeholder="Won" class="w-full bg-gray-50 rounded-xl py-1.5 text-center text-sm font-mono font-bold text-gray-800"></div>
                                </div>
                                <!-- Player 2 Row Layout Elements -->
                                <div class="grid grid-cols-12 gap-2 items-center border-t pt-2 border-gray-50">
                                    <div class="col-span-6"><input tabindex="-1" type="text" x-model="team.p2_name" class="w-full bg-gray-50 rounded-xl px-2 py-1.5 text-sm font-semibold outline-none text-gray-700"></div>
                                    <div class="col-span-3"><input tabindex="2" type="number" min="0" max="13" x-model.number="team.p2_bid" placeholder="Bid" class="w-full bg-gray-50 rounded-xl py-1.5 text-center text-sm font-mono font-bold text-gray-800"></div>
                                    <div class="col-span-3"><input tabindex="4" type="number" min="0" max="13" x-model.number="team.p2_tricks" placeholder="Won" class="w-full bg-gray-50 rounded-xl py-1.5 text-center text-sm font-mono font-bold text-gray-800"></div>
                                </div>
                            </div>
                        </template>
                        <template x-if="!settings.nilAllowed">
                            <div class="space-y-2">
                                <div class="grid grid-cols-2 gap-2 text-[10px] font-bold text-gray-400 uppercase text-center"><div>Team Bid</div><div>Books Won</div></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <input tabindex="5" type="number" min="0" max="13" x-model.number="team.team_bid" placeholder="Bid" class="w-full bg-gray-50 rounded-xl py-2 text-center font-mono font-bold text-gray-800">
                                    <input tabindex="6" type="number" min="0" max="13" x-model.number="team.team_tricks" placeholder="Won" class="w-full bg-gray-50 rounded-xl py-2 text-center font-mono font-bold text-gray-800">
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Round Score Deltas Log History Strip -->
                    <div class="mt-4 pt-3 border-t border-gray-100 flex gap-1 overflow-x-auto items-center">
                        <template x-for="(score, rIndex) in team.history">
                            <span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded-full whitespace-nowrap" x-text="(score >= 0 ? '+' : '') + score + (settings.bagsPenalty && team.bagHistory[rIndex] > 0 ? ' ('+team.bagHistory[rIndex]+'b)' : '')"></span>
                        </template>
                    </div>
                </div>
            </template>
        </div>
        <button @click="saveRound" class="w-full sticky bottom-4 mt-6 bg-green-600 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-transform cursor-pointer">SAVE ROUND</button>
    </main>
    <script th:src="@{/js/spades.js}"></script>
    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
