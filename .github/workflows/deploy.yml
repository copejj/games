name: Secure Build and Remote Deploy

on:
  release:
    types: [published]
  workflow_dispatch: 
    inputs:
      test_tag:
        description: 'Tag to use for testing (e.g. v1.0.0-test)'
        required: false
        default: 'testing'

jobs:
  # --- JOB 1: BUILD OFF-SERVER (IN GITHUB ACTIONS) ---
  build-application:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.determine-tag.outputs.TAG_NAME }}
    steps:
      - name: Determine Tag
        id: determine-tag
        run: |
          TAG="${{ github.event.inputs.test_tag || github.event.release.tag_name }}"
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.test_tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Extract Short Hash and Clean Version
        id: git-info
        run: |
          # Get the 7-character short hash
          echo "SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK & Maven Environment
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR File Off-Server
        # We explicitly pass the clean version tag to the branch property and the short hash to the hash property
        run: |
          mvn clean package -DskipTests \
            -Dgit.branch="${{ steps.determine-tag.outputs.TAG_NAME }}" \
            -Dgit.commit.id.abbrev="${{ steps.git-info.outputs.SHORT_HASH }}"
      - name: Upload WAR Artifact to GitHub Cloud
        uses: actions/upload-artifact@v4.4.3
        with:
          name: target-war-file
          path: target/${{ vars.PROD_APP_NAME }}.war

  # --- JOB 2: SECURE UPLOAD & TOMCAT DEPLOYMENT ---
  deploy-to-production:
    needs: build-application
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ needs.build-application.outputs.tag_name }}
    steps:
      - name: Download Built WAR Artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: target-war-file
          path: .

      # Securely copy the pre-built asset over without building on-server
      - name: Copy WAR over to Server Staging Target
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PROD_HOST }}
          port: ${{ secrets.SSH_PRIVATE_PORT }}
          username: ${{ secrets.SSH_PRIVATE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ vars.PROD_APP_NAME }}.war"
          target: "${{ vars.PROD_APP_PATH }}/target/"

      - name: Execute Remote Deployment Actions
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
        with:
          host: ${{ vars.PROD_HOST }}
          port: ${{ secrets.SSH_PRIVATE_PORT }}
          username: ${{ secrets.SSH_PRIVATE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG_NAME
          script: |
            CURRENT_STEP="INITIALIZATION"
            echo "[Step 1/4] --- Starting Remote Deploy Loop for $TAG_NAME ---"
            cd ${{ vars.PROD_APP_PATH }}
            
            CURRENT_STEP="SOURCE_SYNC"
            # Sync repo state on server without compiling code
            echo "[Step 2/4] Syncing server source tracking to tag: $TAG_NAME"
            git fetch --tags --all
            git checkout -B "release-$TAG_NAME" "$TAG_NAME"

            CURRENT_STEP="TOMCAT_DEPLOYMENT"
            echo "[Step 3/4] Registering versioned asset into Tomcat environment..."
            VERSION_NAME="${{ vars.PROD_DEPLOY_NAME }}##${TAG_NAME}.war"
            BUILD_WAR="${{ vars.PROD_APP_PATH }}/target/${{ vars.PROD_APP_NAME }}.war"

            # Hot-deploy asset into webapps path cleanly
            cp "$BUILD_WAR" "${{ vars.PROD_DEPLOY_PATH }}/$VERSION_NAME"

            CURRENT_STEP="FINAL_CLEANUP"
            echo "[Step 4/4] Finalizing directory state..."
            git checkout .
            rm -f "$BUILD_WAR"
            echo "--- Hot-deployment of $TAG_NAME completed successfully! ---"
