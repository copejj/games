name: Secure Build and Shadow DB Migration Deploy

on:
  release:
    types: [published]
  workflow_dispatch: 
    inputs:
      test_tag:
        description: 'Tag to use for testing (e.g. v1.0.0-test)'
        required: false
        default: 'testing'

jobs:
  # --- JOB 1: SECURE CLOUD COMPILATION (OFF-SERVER) ---
  build-application:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.determine-tag.outputs.TAG_NAME }}
    steps:
      - name: Determine Tag
        id: determine-tag
        run: |
          TAG="${{ github.event.inputs.test_tag || github.event.release.tag_name }}"
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v7 
        with:
          ref: ${{ github.event.inputs.test_tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Extract Short Hash and Clean Version
        id: git-info
        run: |
          # Get the 7-character short hash
          echo "SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK & Maven Environment
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR File Off-Server
        run: |
          mvn clean package -DskipTests \
            -Dgit.branch="${{ steps.determine-tag.outputs.TAG_NAME }}" \
            -Dgit.commit.id.abbrev="${{ steps.git-info.outputs.SHORT_HASH }}" \
            -Dgit.closest.tag.name="${{ steps.determine-tag.outputs.TAG_NAME }}" \
            -Dgit.commit.id.describe="${{ steps.determine-tag.outputs.TAG_NAME }}"

      - name: Upload WAR Artifact to GitHub Cloud
        uses: actions/upload-artifact@v7
        with:
          name: deployment-war-package
          path: target/*.war 

  # --- JOB 2: REMOTE DEPLOYMENT & SHADOW DB MIGRATIONS ---
  deploy-to-production:
    needs: build-application
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ needs.build-application.outputs.tag_name }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: deployment-war-package
          path: .

      # Securely transfer the asset over without compiling anything on your target environment
      - name: Copy WAR over to Server Target Staging Path
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PROD_HOST }}
          port: ${{ secrets.SSH_PRIVATE_PORT }}
          username: ${{ secrets.SSH_PRIVATE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ vars.PROD_APP_NAME }}.war"
          target: "${{ vars.PROD_APP_PATH }}/target/"

      - name: Execute Remote Deployment Actions
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
        with:
          host: ${{ vars.PROD_HOST }}
          port: ${{ secrets.SSH_PRIVATE_PORT }}
          username: ${{ secrets.SSH_PRIVATE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG_NAME
          script: |
            CURRENT_STEP="INITIALIZATION"
            echo "[Step 1/4] --- Starting Safe Deployment Flow for $TAG_NAME ---"
            
            GIT_BIN="/usr/bin/git"
            cd ${{ vars.PROD_APP_PATH }}

            cleanup_on_failure() {
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "!!! ERROR DETECTED in Step: $CURRENT_STEP (Exit Code: $EXIT_CODE) !!!"
                $GIT_BIN checkout .
                exit $EXIT_CODE
              fi
            }
            trap cleanup_on_failure ERR
            
            CURRENT_STEP="SOURCE_CHECKOUT"
            echo "[Step 2/4] Fetching code for tag: $TAG_NAME"
            $GIT_BIN fetch --tags --all
            $GIT_BIN checkout -B "release-$TAG_NAME" "$TAG_NAME"

            CURRENT_STEP="TOMCAT DEPLOYMENT"
            echo "[Step 3/4] Deploying pre-compiled versioned WAR file..."
            VERSION_NAME="${{ vars.PROD_DEPLOY_NAME }}##${TAG_NAME}.war"
            BUILD_WAR="${{ vars.PROD_APP_PATH }}/target/${{ vars.PROD_APP_NAME }}.war"

            cp "$BUILD_WAR" "${{ vars.PROD_DEPLOY_PATH }}/$VERSION_NAME"
            touch "${{ vars.PROD_DEPLOY_PATH }}/$VERSION_NAME"

            CURRENT_STEP="FINAL_CLEANUP"
            echo "[Step 4/4] Cleaning up environment..."
            $GIT_BIN checkout .
            rm -f "$BUILD_WAR"
            echo "--- Deployment of $TAG_NAME completed successfully! ---"
